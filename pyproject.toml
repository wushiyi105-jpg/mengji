[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mengji"
version = "0.1.0"
description = "记录睡眠与梦境,分析质量与趋势"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
mengji = "mengji.cli:main"

[tool.setuptools]
packages = ["mengji"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
